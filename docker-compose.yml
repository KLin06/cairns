services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODEL_S3_BUCKET: ${MODEL_S3_BUCKET}
      MODEL_S3_KEY: ${MODEL_S3_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    volumes:
      # Non-model pipeline output (server/app/config.py's DATASETS_DIR)
      # still reads straight off disk, same as local dev - only the model
      # artifact moves to S3 in this feature. Mounted read-only since the
      # server never writes here.
      - ./data/datasets:/data/datasets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  db_data:
