<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- App identity icon: an amber pine tree. Colors match the fixed hex
       mirrors Map.tsx already reads out of tokens.css for WebGL contexts
       that can't consume oklch (accent-hex, light/dark theme), since a
       standalone favicon document has no access to the host page's theme
       variables. -->
  <rect width="32" height="32" rx="8" fill="#1e2128" />
  <rect x="14" y="23" width="4" height="6" rx="1" fill="#d97706" />
  <polygon points="16,4.5 23,13.5 9,13.5" fill="#f59e0b" />
  <polygon points="16,9.5 25,19.5 7,19.5" fill="#f59e0b" />
  <polygon points="16,15 27,25.5 5,25.5" fill="#f59e0b" />
</svg>
